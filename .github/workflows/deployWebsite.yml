name: Deploy-Website
on: [push]
jobs:

  build:
    name: Deploy-Website
    runs-on: ubuntu-latest
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a set of commands using the runners shell
      - name: Archive TarockWebsite
        run: |
         mkdir ../build
         cp -TR ./TarockWebsite/ ../build
         tar -cvf deploy.tar ../build/

      - name: Delete old TarockWebsite from server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: rm -r -f /opt/lampp/htdocs/*

      - name: Copy new TarockWebsite to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "deploy.tar"
          target: "/opt/lampp/htdocs/"

      - name: Decompress TarockWebsite on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            cd /opt/lampp/htdocs
            tar -xvf deploy.tar
            rm -r -f deploy.tar
            mv ./build/* .
            rm -r -f ./build/
